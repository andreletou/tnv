{% extends 'base.html' %}
{% load static %}

{% block title %}Connexion Livreur - Local-Links{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900 px-4 py-8">
    <div class="max-w-md w-full">
        <!-- En-tête -->
        <div class="text-center mb-8">
            <i class="fas fa-motorcycle text-4xl text-primary-500 mb-4"></i>
            <h1 class="text-2xl font-bold">Connexion Livreur</h1>
            <p class="text-gray-600 dark:text-gray-400 mt-2">Accédez à votre espace de livraison</p>
        </div>

        <!-- Formulaire -->
        <div class="stat-card">
            <form method="post">
                {% csrf_token %}
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-2">Nom d'utilisateur</label>
                        <input type="text" name="username" required 
                               class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700"
                               placeholder="Votre nom d'utilisateur">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium mb-2">Mot de passe</label>
                        <input type="password" name="password" required 
                               class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700"
                               placeholder="Votre mot de passe">
                    </div>

                    <button type="submit" 
                            class="w-full py-3 bg-primary-500 hover:bg-primary-600 text-white rounded-lg font-medium transition-colors">
                        <i class="fas fa-sign-in-alt mr-2"></i>Se connecter
                    </button>
                </div>
            </form>

            <div class="mt-6 text-center">
                <p class="text-gray-600 dark:text-gray-400">
                    Pas encore de compte ? 
                    <a href="{% url 'livraisons:inscription' %}" class="text-primary-500 font-medium">
                        S'inscrire
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
